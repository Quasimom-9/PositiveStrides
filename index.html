<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Positive Strides Stakes 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,600;0,700;1,400&family=Barlow+Condensed:wght@600;700;800&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
<style>
:root {
  --green-dark:  #0d2410;
  --gold:        #C9982A;
  --gold-bright: #FFD700;
  --cream:       #FFF8E7;
  --cream-dim:   #C8BEA0;
  --border:      rgba(201,152,42,0.55);
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

body {
  background: var(--green-dark);
  background-image: radial-gradient(ellipse at 50% 0%, rgba(201,152,42,0.10) 0%, transparent 55%);
  color: var(--cream);
  font-family: 'Barlow', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: 32px;
}
#wrapper { max-width: 1080px; margin: 0 auto; padding: 12px 12px 0; }

/* ── HEADER ── */
header {
  text-align: center; padding: 13px 10px 11px;
  border: 2px solid var(--gold); border-bottom: none; border-radius: 10px 10px 0 0;
  background: linear-gradient(180deg, rgba(201,152,42,0.16) 0%, transparent 100%);
  position: relative;
}
header::before, header::after { content:'🌹'; position:absolute; top:11px; font-size:17px; }
header::before { left:13px; } header::after { right:13px; }
#race-num {
  font-family:'Barlow Condensed',sans-serif; font-size:11px; letter-spacing:4px;
  color:var(--gold); text-transform:uppercase; margin-bottom:1px;
}
#race-name {
  font-family:'Playfair Display',serif; font-size:25px; font-weight:900;
  color:var(--gold-bright); text-shadow:0 2px 8px rgba(0,0,0,0.7); line-height:1.1;
}
#race-meta { font-family:'Barlow Condensed',sans-serif; font-size:13px; color:var(--gold); margin-top:2px; letter-spacing:1px; }

/* ── MAIN ── */
#main { display:flex; border:2px solid var(--gold); border-top:none; border-bottom:none; }
#canvas-wrap { flex:1; background:#1a3d16; padding:8px; position:relative; }
canvas#track { display:block; border-radius:5px; border:1px solid rgba(201,152,42,0.3); }

/* ── SIDEBAR ── */
#sidebar {
  width:300px; flex-shrink:0; border-left:2px solid var(--gold);
  background:rgba(0,0,0,0.4); display:flex; flex-direction:column;
}
#panel-header {
  font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:700;
  letter-spacing:3px; color:var(--gold); text-transform:uppercase;
  padding:10px 12px 8px; border-bottom:1px solid var(--border);
  background:rgba(0,0,0,0.2);
}
#leaderboard { flex:1; overflow-y:auto; padding:4px 0; }

/* Leaderboard rows */
.lb-row {
  display:flex; align-items:center; gap:8px;
  padding:7px 12px; border-bottom:1px solid rgba(255,255,255,0.05);
  transition:background 0.25s;
}
.lb-row.first-place { background:rgba(255,215,0,0.10); }
.lb-place {
  font-family:'Barlow Condensed',sans-serif; font-weight:700;
  font-size:18px; color:var(--gold); width:22px; text-align:center; flex-shrink:0;
}
.silk-swatch {
  width:16px; height:16px; border-radius:4px; flex-shrink:0;
  border:2px solid rgba(255,255,255,0.4);
}
.lb-info { flex:1; min-width:0; }
.lb-horse { font-weight:700; font-size:15px; display:block; line-height:1.2; }
.lb-jockey { font-size:13px; color:var(--cream-dim); display:block; font-style:italic; }
.lb-fin {
  font-family:'Barlow Condensed',sans-serif; font-size:10px; font-weight:700;
  letter-spacing:1px; background:var(--gold); color:#000;
  padding:2px 6px; border-radius:4px; flex-shrink:0;
}
.odds-val {
  font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px;
  color:var(--gold-bright); flex-shrink:0; letter-spacing:0.5px;
}

/* Pre-race PP panel columns */
.pp-col-horse {
  flex:1; font-weight:700; font-size:13px;
}
.pp-col-jockey {
  flex:1.1; font-size:12px; color:var(--cream-dim); font-style:italic;
}
.pp-col-odds {
  font-size:14px; min-width:36px; text-align:right;
}
.lb-row.pp-header {
  background:rgba(201,152,42,0.12);
  border-bottom:1px solid rgba(201,152,42,0.4);
  padding-bottom:6px; margin-bottom:2px;
}
.lb-row.pp-header .lb-place,
.lb-row.pp-header .pp-col-horse,
.lb-row.pp-header .pp-col-jockey,
.lb-row.pp-header .pp-col-odds {
  font-family:'Barlow Condensed',sans-serif; font-size:10px; font-weight:700;
  letter-spacing:2px; text-transform:uppercase; color:var(--gold);
  font-style:normal;
}

/* Results mode rows */
.lb-row.result-row .lb-place { font-size:20px; }

/* Sidebar action button */
#sidebar-footer { padding:10px 12px; border-top:1px solid var(--border); }
#reset-btn {
  width:100%; font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:700;
  letter-spacing:2px; text-transform:uppercase;
  background:linear-gradient(135deg,#8a6010,var(--gold-bright),#8a6010);
  color:#1a0f00; border:none; padding:11px; border-radius:8px;
  cursor:pointer; box-shadow:0 3px 14px rgba(201,152,42,0.35); transition:transform 0.15s;
}
#reset-btn:hover { transform:translateY(-2px); }
#reset-btn.hidden { display:none; }

/* ── COMMENTARY BAR ── */
#commentary-bar {
  border:2px solid var(--gold); border-top:1px solid var(--border); border-bottom:none;
  background:rgba(0,0,0,0.5); padding:9px 14px; min-height:50px;
  display:flex; align-items:center; gap:12px;
}
#commentary-label {
  font-family:'Barlow Condensed',sans-serif; font-size:10px; font-weight:700;
  letter-spacing:2px; color:var(--gold); text-transform:uppercase;
  flex-shrink:0; writing-mode:vertical-rl; transform:rotate(180deg); opacity:0.55;
}
#commentary-text {
  flex:1; font-size:14px; font-style:italic;
  color:var(--cream); line-height:1.4; text-align:center;
  transition:opacity 0.18s;
}
@keyframes commentaryFlash {
  0%   { color:var(--gold-bright); text-shadow:0 0 22px rgba(255,215,0,0.85); }
  100% { color:#FFFFFF;            text-shadow:0 1px 8px rgba(0,0,0,0.9); }
}
#commentary-text.flash { animation:commentaryFlash 0.55s ease-out; }

/* 3 audio buttons */
#audio-btns {
  display:flex; flex-direction:column; gap:4px; flex-shrink:0;
}
.audio-opt {
  font-family:'Barlow Condensed',sans-serif; font-size:10px; font-weight:700;
  letter-spacing:0.5px; white-space:nowrap; text-align:left;
  padding:4px 10px; border-radius:5px; cursor:pointer;
  border:1px solid rgba(201,152,42,0.35); background:rgba(0,0,0,0.35);
  color:var(--cream-dim); transition:all 0.18s;
}
.audio-opt:hover { background:rgba(201,152,42,0.14); color:var(--cream); }
.audio-opt.active-av  { background:rgba(201,152,42,0.28); color:var(--gold-bright); border-color:var(--gold-bright); }
.audio-opt.active-sfx { background:rgba(45,130,42,0.32);  color:#7ddd7a;            border-color:#5db85a; }
.audio-opt.active-off { background:rgba(80,80,80,0.28);   color:#aaa;               border-color:#666; }

/* ── CONTROLS ── */
#controls {
  border:2px solid var(--gold); border-top:1px solid var(--border);
  border-radius:0 0 10px 10px; background:rgba(0,0,0,0.3); padding:11px;
  display:flex; align-items:center; justify-content:center; gap:12px;
}
#fullscreen-btn {
  font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:700;
  letter-spacing:1px; text-transform:uppercase;
  background:rgba(0,0,0,0.4); color:var(--gold);
  border:1px solid rgba(201,152,42,0.5); padding:10px 18px;
  border-radius:40px; cursor:pointer; transition:background 0.2s, color 0.2s;
  white-space:nowrap;
}
#fullscreen-btn:hover { background:rgba(201,152,42,0.18); color:var(--gold-bright); }
#action-btn {
  font-family:'Barlow Condensed',sans-serif; font-size:17px; font-weight:800;
  letter-spacing:2px; text-transform:uppercase;
  background:linear-gradient(135deg,#8a6010,var(--gold-bright),#8a6010);
  color:#1a0f00; border:2px solid rgba(255,255,255,0.25); padding:12px 48px;
  border-radius:40px; cursor:pointer;
  box-shadow:0 4px 20px rgba(201,152,42,0.35),inset 0 1px 0 rgba(255,255,255,0.3);
  transition:transform 0.15s,box-shadow 0.15s;
}
#action-btn:hover:not(:disabled) { transform:translateY(-3px); box-shadow:0 8px 26px rgba(201,152,42,0.5); }
#action-btn:disabled { opacity:0.4; cursor:default; transform:none; }

/* ── FULLSCREEN SCALING ── */
body.is-fullscreen {
  display:flex; align-items:flex-start; justify-content:center;
  background:#000; padding:0; margin:0; overflow:hidden;
}
body.is-fullscreen #wrapper {
  transform-origin: top center;
  /* scale set dynamically via JS */
}

/* ── COUNTDOWN ── */
#countdown-overlay {
  position:absolute; inset:0; background:rgba(0,0,0,0.72);
  display:flex; align-items:center; justify-content:center;
  z-index:10; border-radius:5px; pointer-events:none;
}
#countdown-overlay.hidden { display:none; }
#countdown-num {
  font-family:'Playfair Display',serif; font-size:90px; font-weight:900;
  color:var(--gold-bright); text-shadow:0 0 40px rgba(255,215,0,0.7);
  animation:cPulse 0.9s ease-in-out;
}
@keyframes cPulse { 0%{transform:scale(1.6);opacity:0} 25%{opacity:1} 100%{transform:scale(0.88);opacity:1} }
</style>
</head>
<body>
<div id="wrapper">
  <header>
    <div id="race-num">Race 1 of 4 &nbsp;·&nbsp; Positive Strides Stakes 2026</div>
    <div id="race-name">Positive Strides Stakes</div>
    <div id="race-meta">6 Furlongs · Timber Grove Farm · Purse: $10,000</div>
  </header>

  <div id="main">
    <div id="canvas-wrap">
      <canvas id="track" width="648" height="400"></canvas>
      <div id="countdown-overlay" class="hidden"><div id="countdown-num">3</div></div>
    </div>
    <aside id="sidebar">
      <div id="panel-header">Post Positions &amp; Odds</div>
      <div id="leaderboard"></div>
      <div id="sidebar-footer">
        <button id="reset-btn" class="hidden">↺ Race Reset</button>
      </div>
    </aside>
  </div>

  <div id="commentary-bar">
    <div id="commentary-label">📢 Announce</div>
    <div id="commentary-text">Welcome to the Positive Strides Stakes 2026! Racing at Timber Grove Farm!</div>
    <div id="audio-btns">
      <button class="audio-opt active-off" data-mode="1" title="Commentary voice + sound effects">🔊 Voice + Sounds</button>
      <button class="audio-opt"            data-mode="2" title="Sound effects only, no voice">🎵 Sounds Only</button>
      <button class="audio-opt"            data-mode="0" title="No audio at all">🔇 No Audio</button>
    </div>
  </div>
  <div id="controls">
    <button id="action-btn">🏁 Post Time — Start Race</button>
    <button id="fullscreen-btn">⛶ Full Screen</button>
  </div>
</div>

<script>
/* =================================================================
   POSITIVE STRIDES STAKES 2026
   ================================================================= */

/* ── SILK COLORS (saddle badge only) ──────────────────────────── */
const SILKS = {
  Clacky:  { primary:'#1a56cc', secondary:'#FFFFFF' },
  Rudy:    { primary:'#CC0000', secondary:'#FFD700' },
  Ben:     { primary:'#2E8B57', secondary:'#FFFFFF' },
  Hank:    { primary:'#CC5500', secondary:'#000000' },
  Skipper: { primary:'#003080', secondary:'#C0C0C0' },
  Pumpkin: { primary:'#7B2D8B', secondary:'#F97316' },
  Fred:    { primary:'#0D9488', secondary:'#EAB308' },
  Mandi:   { primary:'#C91E8C', secondary:'#000000' },
  Aspen:   { primary:'#DAA520', secondary:'#3B1A08' },
};

/* ── REALISTIC HORSE COAT COLORS ───────────────────────────────── */
const COATS = {
  // Clacky  — true black
  Clacky:  { body:'#1A1A1A', mane:'#0A0A0A', nose:'#2E2020', leg:'#141414' },
  // Rudy    — dark brown (seal brown)
  Rudy:    { body:'#3A1F0D', mane:'#1A0A04', nose:'#5A3520', leg:'#2A1408' },
  // Ben     — chestnut
  Ben:     { body:'#B8521A', mane:'#7A3410', nose:'#CC7040', leg:'#B8521A' },
  // Hank    — bright chestnut/sorrel with white blaze (matches photo)
  Hank:    { body:'#C05E2A', mane:'#7A3810', nose:'#D08858', leg:'#C05E2A' },
  // Skipper — dark chestnut (deep liver chestnut)
  Skipper: { body:'#6B2810', mane:'#3A1408', nose:'#8A4428', leg:'#6B2810' },
  // Pumpkin — dark orange (burnt orange, like a dark pumpkin)
  Pumpkin: { body:'#C45A08', mane:'#7A3804', nose:'#D47828', leg:'#C45A08' },
  // Fred    — very dark brown, almost black (dark seal brown)
  Fred:    { body:'#1E0E06', mane:'#0A0604', nose:'#3A2010', leg:'#140A04' },
  // Mandi   — bright chestnut (vivid copper-red, flaxen mane)
  Mandi:   { body:'#C4460A', mane:'#E8A060', nose:'#D86030', leg:'#C4460A' },
  // Aspen   — bay (rich reddish-brown body, black mane/tail/legs, draft build)
  Aspen:   { body:'#8B3A10', mane:'#1A0A04', nose:'#A05030', leg:'#1A0A04' },
};

/* ── HORSE ENTRIES — all jockey sets, one picked randomly each race ── */
const HORSE_NAMES = ['Clacky','Rudy','Ben','Hank','Skipper','Pumpkin','Fred','Mandi','Aspen'];

/* ── JOCKEYS — Positive Strides Preakness Party Program ───────── */
const ALL_JOCKEYS = [
  'Alexis R.','Billy M.','Brandie P.','Cami C.','Colt L.',
  'David C.','Dominic M.','Emerie C.','Emily W.','Erin D.',
  'Forrest R.','Gaige N.','Greg H.','Hailey R.','Hannah S.',
  'Howard C.','Jake S.','James V.','Jay W.','Joe F.',
  'Jonah W.','Judy M.','Kahlil','Kim H.','Linda R.',
  'Lisa S.','Matt B.','Matt C.','Nadeline R.','Nicky L.',
  'Patrick M.','PJ L.','Quinn V.','Rachael L.','Sebastian B.',
  'Sebastian C.','Serenity R.','Shawn G.','Skip M.','Tully D.',
  'Zach F.','Zach H.',
];

/* ── PROPER FISHER-YATES SHUFFLE — no bias ── */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Fresh random jockeys (no repeats) and random PP order every race
function buildEntries() {
  const jockeyDraw = shuffle([...ALL_JOCKEYS]).slice(0, 9);
  const order = shuffle([...HORSE_NAMES]);
  return order.map((horse, i) => ({ horse, pp: i + 1, jockey: jockeyDraw[i] }));
}

/* ── TRACK GEOMETRY ────────────────────────────────────────────── */
const CW=648, CH=400;
const TRK={cx:308, cy:198, rx:215, ry:133, bw:50};

function trackPos(progress, laneOff){
  const ang = Math.PI/2 + progress*2*Math.PI;
  const rx = TRK.rx + (laneOff||0);
  const ry = TRK.ry + (laneOff||0)*0.619;
  return { x: TRK.cx + rx*Math.cos(ang), y: TRK.cy + ry*Math.sin(ang) };
}
function travelAngle(progress){
  // Never clamp to 1.0 — horses travel past the line so we need the real angle
  const a=trackPos(progress, 0), b=trackPos(progress+0.0008, 0);
  return Math.atan2(b.y-a.y, b.x-a.x);
}

/* ── CROWD DATA (pre-generated, stable per session) ────────────── */
const CROWD_COLORS = [
  '#FF6B6B','#FF8E53','#FFC93C','#6BCB77','#4D96FF','#CC5DE8',
  '#F06595','#FF922B','#20C997','#74C0FC','#FFE066','#A9E34B',
  '#FF8787','#DA77F2','#FFFFFF','#FFA94D','#63E6BE','#91A7FF',
];
const CROWD_ROWS = [34, 46, 58]; // laneOffset values (outside outer rail)
const CROWD_DOTS_PER_ROW = 74;
const crowdData = CROWD_ROWS.map(offset =>
  Array.from({length: CROWD_DOTS_PER_ROW}, (_, i) => {
    const progress = i / CROWD_DOTS_PER_ROW;
    const pos = trackPos(progress, offset);
    const color = CROWD_COLORS[Math.floor(Math.random()*CROWD_COLORS.length)];
    return { x: pos.x, y: pos.y, color, r: 2.8 + Math.random()*1.2 };
  })
);

let crowdExcite = 0; // 0–1, decays each frame

/* ── AUDIO ENGINE ──────────────────────────────────────────────── */
// audioMode: 0=off  1=Voice+Sounds  2=Sounds only
let audioMode = 0;
let actx = null;
let hoofInterval = null, hoofPitch = 1.0, hoofStep = 0;

function ensureAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state !== 'running') return actx.resume();
  return Promise.resolve();
}

// After ensureAudio resolves, context is running — safe to create nodes
function canPlay() {
  return audioMode > 0 && actx && actx.state === 'running';
}

function unlockSpeech() {
  if (!window.speechSynthesis || speechUnlocked) return;
  speechUnlocked = true;
  // Must be non-empty for Chrome to accept it as a valid unlock gesture
  const u = new SpeechSynthesisUtterance('go');
  u.volume = 0.001; u.rate = 2.0;
  const v = loadVoice(); if (v) u.voice = v;
  u.onend = () => {
    if (speechQueue.length > 0) { _doSpeak(speechQueue.pop()); speechQueue = []; }
  };
  window.speechSynthesis.speak(u);
  speechKeepAlive = setInterval(() => {
    if (window.speechSynthesis.speaking) {
      window.speechSynthesis.pause();
      window.speechSynthesis.resume();
    }
  }, 12000);
}

function setAudioMode(mode) {
  stopHoofbeats();
  stopSpeech();
  if (mode !== 1) {
    speechUnlocked = false;
    clearInterval(speechKeepAlive);
    speechKeepAlive = null;
  }
  audioMode = mode;
  document.querySelectorAll('.audio-opt').forEach(b => {
    b.classList.remove('active-av','active-sfx','active-off');
  });
  const activeClass = mode === 1 ? 'active-av' : mode === 2 ? 'active-sfx' : 'active-off';
  document.querySelector(`.audio-opt[data-mode="${mode}"]`).classList.add(activeClass);
  if (audioMode > 0) {
    // Wait for context to be fully running before scheduling any nodes
    ensureAudio().then(() => {
      if (audioMode > 0 && racePhase === 'racing') startHoofbeats();
    });
    if (mode === 1) unlockSpeech();
  }
}

document.querySelectorAll('.audio-opt').forEach(btn => {
  btn.addEventListener('click', () => setAudioMode(parseInt(btn.dataset.mode)));
});
// Default: No Audio button active
document.querySelector('.audio-opt[data-mode="0"]').classList.add('active-off');

/* ── HOOFBEATS ── */
function startHoofbeats() {
  stopHoofbeats();
  // Small delay to let the AudioContext fully resume after the click gesture
  setTimeout(() => {
    if (audioMode > 0 && actx) {
      ensureAudio().then(() => {
        if (audioMode > 0) {
          hoofInterval = setInterval(() => { if (canPlay()) playHoof(); }, 130);
        }
      });
    }
  }, 80);
}
function stopHoofbeats() { clearInterval(hoofInterval); hoofInterval = null; }

function playHoof() {
  try {
    if (actx.state !== 'running') actx.resume();
    const now = actx.currentTime;
    hoofStep = (hoofStep + 1) % 4;
    const heavy = hoofStep % 2 === 0;
    [0, 0.048].forEach(offset => {
      const t = now + offset, dur = 0.07;
      const len = Math.ceil(actx.sampleRate * dur);
      const buf = actx.createBuffer(1, len, actx.sampleRate);
      const d   = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = actx.createBufferSource(); src.buffer = buf;
      const lp  = actx.createBiquadFilter();
      lp.type   = 'lowpass';
      lp.frequency.setValueAtTime(heavy ? 440 * hoofPitch : 300 * hoofPitch, t);
      lp.frequency.exponentialRampToValueAtTime(40, t + dur);
      const g = actx.createGain();
      g.gain.setValueAtTime(heavy ? 0.85 : 0.58, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(lp); lp.connect(g); g.connect(actx.destination);
      src.start(t); src.stop(t + dur + 0.005);
    });
  } catch(e) { console.error('hoof:', e); }
}

/* ── CROWD CHEERING — voiced harmonics, not noise ── */
function playCrowd(dur = 1.5, vol = 0.25) {
  if (!canPlay()) return;
  try {
    if (actx.state !== 'running') actx.resume();
    const now = actx.currentTime;

    // ── Layer 1: CROWD ROAR — dozens of voices approximated by
    //    sawtooth oscillators at varying pitches, filtered to
    //    vocal formants (the "AHHHH" sound of a crowd)
    const voicePitches = [90,95,100,105,110,115,120,128,135,142,150,160,170,180,200,220];
    voicePitches.forEach((freq, i) => {
      const osc = actx.createOscillator();
      osc.type = 'sawtooth';
      // Slight pitch drift — no two voices stay perfectly in tune
      osc.frequency.setValueAtTime(freq * (0.97 + Math.random() * 0.06), now);
      osc.frequency.linearRampToValueAtTime(freq * (1.02 + Math.random() * 0.06), now + dur);

      // Formant 1 — "ah" vowel body (~700 Hz)
      const f1 = actx.createBiquadFilter();
      f1.type = 'bandpass'; f1.frequency.value = 680 + Math.random() * 80; f1.Q.value = 3;

      // Formant 2 — "ah" upper resonance (~1100 Hz)
      const f2 = actx.createBiquadFilter();
      f2.type = 'bandpass'; f2.frequency.value = 1050 + Math.random() * 120; f2.Q.value = 4;

      // Combine formants via gain merge
      const merge = actx.createGain(); merge.gain.value = 0.5;

      // Rhythmic AM at 3–5 Hz — gives the "waving cheer" feel
      const am    = actx.createOscillator();
      const amGain= actx.createGain();
      am.type     = 'sine';
      am.frequency.value  = 3.0 + Math.random() * 2.5;
      amGain.gain.value   = 0.4;

      // Master envelope
      const env = actx.createGain();
      env.gain.setValueAtTime(0, now);
      env.gain.linearRampToValueAtTime(vol * 0.06, now + 0.25 + i * 0.008);
      env.gain.setValueAtTime(vol * 0.06, now + dur - 0.3);
      env.gain.linearRampToValueAtTime(0, now + dur);

      osc.connect(f1); osc.connect(f2);
      f1.connect(merge); f2.connect(merge);
      am.connect(amGain); // amGain modulates env gain — baked approach
      merge.connect(env); env.connect(actx.destination);

      osc.start(now); osc.stop(now + dur);
      am.start(now);  am.stop(now + dur);
    });

    // ── Layer 2: WHOOPING — 4–8 individual "WHOOOO!" glissandos
    //    rising-pitch oscillators that sweep up like a person whooping
    const whoopCount = Math.floor(3 + Math.random() * 5);
    for (let i = 0; i < whoopCount; i++) {
      const t0    = now + 0.1 + Math.random() * (dur * 0.6);
      const wDur  = 0.35 + Math.random() * 0.45;
      const startF= 180 + Math.random() * 120;
      const osc   = actx.createOscillator();
      const wEnv  = actx.createGain();
      osc.type    = 'sawtooth';
      osc.frequency.setValueAtTime(startF, t0);
      // Pitch sweeps UP — that's the "whoo!" shape
      osc.frequency.exponentialRampToValueAtTime(startF * (1.6 + Math.random() * 0.8), t0 + wDur);

      // Formant on the whoop
      const wf = actx.createBiquadFilter();
      wf.type = 'bandpass'; wf.frequency.value = 800 + Math.random() * 400; wf.Q.value = 5;

      wEnv.gain.setValueAtTime(0, t0);
      wEnv.gain.linearRampToValueAtTime(vol * 0.18, t0 + 0.04);
      wEnv.gain.exponentialRampToValueAtTime(0.0001, t0 + wDur);

      osc.connect(wf); wf.connect(wEnv); wEnv.connect(actx.destination);
      osc.start(t0); osc.stop(t0 + wDur + 0.01);
    }

    // ── Layer 3: CLAPPING — short low-frequency noise bursts at ~3 Hz
    if (vol > 0.20) {
      const clapRate = 0.28 + Math.random() * 0.08;
      let ct = now + 0.1;
      while (ct < now + dur - 0.1) {
        const cDur = 0.04;
        const cLen = Math.ceil(actx.sampleRate * cDur);
        const cBuf = actx.createBuffer(1, cLen, actx.sampleRate);
        const cd   = cBuf.getChannelData(0);
        for (let j = 0; j < cLen; j++) cd[j] = Math.random() * 2 - 1;
        const cSrc = actx.createBufferSource(); cSrc.buffer = cBuf;
        const cLp  = actx.createBiquadFilter();
        cLp.type = 'lowpass'; cLp.frequency.value = 3000;
        const cG = actx.createGain();
        cG.gain.setValueAtTime(vol * 0.15, ct);
        cG.gain.exponentialRampToValueAtTime(0.0001, ct + cDur);
        cSrc.connect(cLp); cLp.connect(cG); cG.connect(actx.destination);
        cSrc.start(ct); cSrc.stop(ct + cDur + 0.005);
        ct += clapRate;
      }
    }

  } catch(e) { console.error('crowd:', e); }
}

function playBell() {
  if (!canPlay()) return;
  try {
    if (actx.state !== 'running') actx.resume();
    const t0 = actx.currentTime;
    [880, 1108, 1320].forEach((freq, i) => {
      const t = t0 + i * 0.05;
      const osc = actx.createOscillator(), g = actx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
      osc.connect(g); g.connect(actx.destination);
      osc.start(t); osc.stop(t + 1.3);
    });
  } catch(e) {}
}

function playFanfare() {
  if (!canPlay()) return;
  try {
    if (actx.state !== 'running') actx.resume();
    const notes = [523,659,784,1047,784,1047,784,659,523];
    const durs  = [.14,.14,.14,.28,.14,.28,.14,.14,.45];
    let t = actx.currentTime + 0.05;
    notes.forEach((freq, i) => {
      const osc = actx.createOscillator(), g = actx.createGain();
      osc.type = 'square'; osc.frequency.value = freq;
      g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + durs[i] - 0.02);
      osc.connect(g); g.connect(actx.destination);
      osc.start(t); osc.stop(t + durs[i]);
      t += durs[i] + 0.02;
    });
    playCrowd(3.5, 0.3);
  } catch(e) {}
}

/* ── ANNOUNCER VOICE — Chrome-compatible ──
   Chrome rules:
   1. First speak() MUST be synchronous inside a user click handler (no setTimeout)
   2. After that, speaks from timers work fine
   3. Chrome silently stops after ~15s of speaking — needs pause/resume keepalive
   4. Empty-string utterances are ignored and don't count as an unlock           */

let speechQueue   = [];     // only ever holds 0 or 1 item (latest call wins)
let speechUnlocked = false;
let cachedVoice   = null;
let speechKeepAlive = null;

function loadVoice() {
  if (cachedVoice) return cachedVoice;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return null;
  cachedVoice = voices.find(v => /daniel|alex|fred|bruce|ralph|thomas|google us english/i.test(v.name))
             || voices.find(v => v.lang === 'en-US')
             || voices.find(v => /^en/.test(v.lang))
             || voices[0];
  return cachedVoice;
}

function _doSpeak(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.rate   = 1.10;
  u.pitch  = 1.20;
  u.volume = 1.0;
  const v = loadVoice();
  if (v) u.voice = v;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

// Called SYNCHRONOUSLY inside a click handler to unlock Chrome
function unlockSpeech() {
  if (!window.speechSynthesis || speechUnlocked) return;
  speechUnlocked = true;
  // Speak a real word at zero volume — Chrome requires non-empty content
  const unlock = new SpeechSynthesisUtterance('go');
  unlock.volume = 0.001;
  unlock.rate   = 2.0;
  const v = loadVoice();
  if (v) unlock.voice = v;
  window.speechSynthesis.speak(unlock);

  // Chrome keepalive: every 12 seconds nudge the engine so it doesn't pause itself
  speechKeepAlive = setInterval(() => {
    if (window.speechSynthesis.speaking) {
      window.speechSynthesis.pause();
      window.speechSynthesis.resume();
    }
  }, 12000);

  // Process any queued speaks after unlock utterance ends
  unlock.onend = () => {
    if (speechQueue.length > 0) {
      _doSpeak(speechQueue.pop());
      speechQueue = [];
    }
  };
}

function speak(text) {
  if (audioMode !== 1 || !window.speechSynthesis) return;
  if (!speechUnlocked) {
    // Not yet unlocked — just queue it, will fire when unlock ends
    speechQueue = [text];
    return;
  }
  // Already unlocked — cancel whatever's playing, speak immediately
  // Use setTimeout(0) only to avoid blocking the animation frame
  speechQueue = [text];
  setTimeout(() => {
    if (speechQueue.length > 0 && audioMode === 1) {
      _doSpeak(speechQueue.pop());
      speechQueue = [];
    }
  }, 0);
}

function stopSpeech() {
  window.speechSynthesis?.cancel();
  speechQueue = [];
}

function triggerCommentary(text, soundFn) {
  setCommentaryText(text);
  if (audioMode === 1) { speak(text); soundFn && setTimeout(soundFn, 100); }
  else if (audioMode === 2) { soundFn && soundFn(); }
  crowdExcite = Math.min(crowdExcite + 0.6, 1.0);
}

/* ── STATE ─────────────────────────────────────────────────────── */
let raceIdx=0, racePhase='pre', horses=[], tick=0, frameId=null, raceResults=[];
const cfired=new Set();

/* ── HORSE INIT — fully randomised every race ──────────────────── */
const ALL_PERS = ['front-runner','closer','stalker','pace-setter','mid-pack'];

function initHorses(entries){
  const n = entries.length;

  const surgeCount = Math.random() < 0.4 ? 2 : 1;
  const surgeIdxs  = new Set();
  while (surgeIdxs.size < surgeCount) surgeIdxs.add(Math.floor(Math.random() * n));

  const laneOffsets = shuffle(
    Array.from({length: n}, (_, i) => (i - (n - 1) / 2) * 5.4)
  );

  return entries.map((e, i) => {
    const personality = ALL_PERS[Math.floor(Math.random() * ALL_PERS.length)];

    // Wider form rating — 0.80 to 1.20 — makes the day's form the main decider
    const baseSpeed  = 0.000295 + Math.random() * 0.000195;
    const formRating = 0.80 + Math.random() * 0.40;

    // Each horse also gets a random "luck event" progress point (0.45–0.75)
    // where they get a brief 1–2 second extra burst or stumble — pure chaos
    const luckAt    = 0.45 + Math.random() * 0.30;
    const luckMult  = 0.82 + Math.random() * 0.36; // 0.82 (stumble) to 1.18 (burst)
    const luckDone  = false;

    return {
      ...e,
      silk: SILKS[e.horse], coat: COATS[e.horse],
      progress: 0, speed: 0,
      baseSpeed: baseSpeed * formRating,
      personality,
      luckAt, luckMult, luckDone,
      hasBigMove:    surgeIdxs.has(i),
      bigMoveDone:   false,
      bigMoveActive: false,
      bigMoveEndTick: 0,
      _bigFired: false,
      finished: false, settled: false, place: null,
      laneOffset: laneOffsets[i],
      phase: Math.random() * Math.PI * 2,
    };
  });
}

/* ── PHYSICS ───────────────────────────────────────────────────── */
function tickHorses(){
  const leader=horses.reduce((b,h)=>h.progress>b.progress?h:b,horses[0]);
  const lp=leader?leader.progress:0;
  let fin=0;

  horses.forEach(h=>{
    // Settled = fully stopped past the line, no more updates needed
    if(h.settled){ fin++; return; }

    if(h.finished){
      // Horse has crossed — decelerate and roll out ~8% past the line
      h.speed *= 0.88;  // friction / gradual slowdown
      h.progress += h.speed;
      if(h.speed < 0.000015 || h.progress >= 1.08){
        h.progress = Math.min(h.progress, 1.08);
        h.speed = 0;
        h.settled = true;
      }
      fin++;
      return;
    }

    const p=h.progress;
    let mult;
    // Tightened personality bands — personality shapes the race but form rating decides the winner
    switch(h.personality){
      case'front-runner': mult=p<0.22?1.18:p<0.58?1.05:0.88+Math.random()*0.08; break;
      case'closer':       mult=p<0.42?0.88:p<0.68?1.02:1.22+Math.random()*0.08; break;
      case'stalker':      mult=p<0.52?0.96:1.10+Math.random()*0.07; break;
      case'pace-setter':  mult=p<0.48?1.10:0.94+Math.random()*0.08; break;
      default:            mult=0.96+Math.random()*0.10; break;
    }
    // One-time luck event per horse — brief burst or stumble mid-race
    if(!h.luckDone && p >= h.luckAt){
      mult *= h.luckMult;
      h.luckDone = true;
    }
    if(h.hasBigMove&&!h.bigMoveDone){
      if(!h.bigMoveActive&&lp>=0.58){ h.bigMoveActive=true; h.bigMoveEndTick=tick+95; h._bigFired=true; }
      if(h.bigMoveActive&&tick<h.bigMoveEndTick) mult*=1.56;
      if(h.bigMoveActive&&tick>=h.bigMoveEndTick){ h.bigMoveActive=false; h.bigMoveDone=true; }
    }
    mult *= 0.94 + Math.random() * 0.12;  // wider per-tick noise
    h.speed+=(h.baseSpeed*mult-h.speed)*0.09;
    h.progress+=h.speed;  // no clamp — horse runs through the line naturally

    if(h.progress>=1.0&&!h.finished){
      h.finished=true; h.settled=false;
      h.place=raceResults.length+1; raceResults.push({...h});
    }
  });

  hoofPitch=0.96+lp*0.28;
  return fin;
}

/* ── COMMENTARY ────────────────────────────────────────────────── */
function sorted(){return [...horses].sort((a,b)=>b.progress-a.progress);}

const CALLS=[
  {id:'gate',   at:0.01,
   text:()=>{ const h=sorted()[0]; return `And they're off! ${h.horse} breaks from the gate — ${h.jockey} asking for position!`; },
   sound:()=>{ playBell(); playCrowd(1.2,0.14); }},
  {id:'turn1',  at:0.14,
   text:()=>{ const[a,b]=sorted(); return `Into the first turn — ${a.horse} with ${a.jockey} on the lead! ${b.horse} right in behind!`; },
   sound:null},
  {id:'back',   at:0.30,
   text:()=>{ const[a]=sorted(),l=sorted().at(-1); return `On the backstretch: ${a.horse} leads with ${a.jockey} — ${l.horse} saving ground at the back!`; },
   sound:null},
  {id:'half',   at:0.50,
   text:()=>{ const[a,b,c]=sorted(); return `Halfway! ${a.horse} in front — ${b?.horse} and ${c?.horse} looking for room!`; },
   sound:()=>playCrowd(1.1,0.14)},
  {id:'bigmove',at:0.61,
   text:()=>{ const m=horses.find(h=>h._bigFired); return m?`Here comes ${m.horse}! ${m.jockey} is making a HUGE move from the back!`:(()=>{ const[a,b]=sorted(); return`Far turn — ${a.horse} and ${b.horse} in a battle for the lead!`; })(); },
   sound:()=>playCrowd(2.0,0.20)},
  {id:'stretch',at:0.78,
   text:()=>{ const[a,b]=sorted(); return `Turning for home! ${a.horse} leads — ${b.horse} with ${b.jockey} flying on the outside!`; },
   sound:()=>playCrowd(2.2,0.24)},
  {id:'final',  at:0.90,
   text:()=>{ const[a,b]=sorted(); return `Final furlong! ${a.horse} by a ${['neck','head','nose'][tick%3]}! ${b.jockey} driving hard!`; },
   sound:()=>playCrowd(2.8,0.30)},
  {id:'wire',   at:0.97,
   text:()=>{ const[a]=sorted(); return `It's going to be ${a.horse} with ${a.jockey}! They're going to WIN!!`; },
   sound:null},
];

function setCommentaryText(txt){
  const el=document.getElementById('commentary-text');
  el.style.opacity=0;
  setTimeout(()=>{
    el.textContent=txt;
    el.style.opacity=1;
    el.classList.remove('flash');
    void el.offsetWidth; // reflow to restart animation
    el.classList.add('flash');
  },160);
}

function checkCommentary(){
  const leader=sorted()[0]; if(!leader)return;
  CALLS.forEach(c=>{ if(!cfired.has(c.id)&&leader.progress>=c.at){ cfired.add(c.id); triggerCommentary(c.text(),c.sound); } });
}

/* ── CANVAS RENDERING ──────────────────────────────────────────── */
const canvas=document.getElementById('track');
const ctx=canvas.getContext('2d');

function drawScene(){
  // 1. BG
  ctx.fillStyle='#1a3d16'; ctx.fillRect(0,0,CW,CH);

  // 2. CROWD IN STANDS
  const excMult = 1 + crowdExcite * 0.7;
  crowdData.forEach((row,ri)=>{
    row.forEach(dot=>{
      const flicker = crowdExcite>0.1 ? 0.8+Math.random()*0.4 : 1;
      ctx.globalAlpha = (0.7 + ri*0.1) * flicker;
      ctx.fillStyle = dot.color;
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, dot.r * excMult * flicker, 0, Math.PI*2);
      ctx.fill();
    });
  });
  ctx.globalAlpha=1;

  // 3. TRACK SURFACE
  ctx.lineWidth=TRK.bw; ctx.strokeStyle='#b38f50';
  ctx.beginPath(); ctx.ellipse(TRK.cx,TRK.cy,TRK.rx,TRK.ry,0,0,Math.PI*2); ctx.stroke();

  // Track grain texture
  for(let i=-1;i<=1;i+=0.4){
    ctx.lineWidth=1; ctx.strokeStyle='rgba(140,105,45,0.3)';
    ctx.beginPath(); ctx.ellipse(TRK.cx,TRK.cy,TRK.rx+i*8,TRK.ry+i*4.8,0,0,Math.PI*2); ctx.stroke();
  }

  // 4. RAILS
  ctx.lineWidth=5; ctx.strokeStyle='#6a4f22';
  ctx.beginPath(); ctx.ellipse(TRK.cx,TRK.cy,TRK.rx+TRK.bw/2+2,TRK.ry+TRK.bw/2+2,0,0,Math.PI*2); ctx.stroke();
  ctx.lineWidth=4;
  ctx.beginPath(); ctx.ellipse(TRK.cx,TRK.cy,TRK.rx-TRK.bw/2-1,TRK.ry-TRK.bw/2-1,0,0,Math.PI*2); ctx.stroke();

  // 5. INFIELD
  ctx.fillStyle='#276022';
  ctx.beginPath(); ctx.ellipse(TRK.cx,TRK.cy,TRK.rx-TRK.bw/2-2,TRK.ry-TRK.bw/2-2,0,0,Math.PI*2); ctx.fill();

  // Infield PS logo
  ctx.save(); ctx.globalAlpha=0.18;
  ctx.font='bold 42px "Playfair Display",serif'; ctx.fillStyle='#FFD700';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('PS',TRK.cx,TRK.cy-11);
  ctx.font='bold 11px "Barlow Condensed",sans-serif'; ctx.letterSpacing='3px';
  ctx.fillText('STAKES 2026',TRK.cx,TRK.cy+18);
  ctx.restore();

  // 6. FINISH LINE
  const sf=trackPos(0,0);
  ctx.save(); ctx.translate(sf.x,sf.y);
  ctx.strokeStyle='#fff'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(0,-TRK.bw*0.78); ctx.lineTo(0,TRK.bw*0.78); ctx.stroke();
  for(let r=0;r<5;r++) for(let c=0;c<2;c++){
    ctx.fillStyle=(r+c)%2===0?'#000':'#fff';
    ctx.fillRect(c*4-4,r*7-TRK.bw*0.78,4,7);
  }
  ctx.restore();

  // 7. HORSES
  const order=sorted(), leader=order[0];
  [...horses].filter(h=>h!==leader).forEach(h=>drawHorse(h,false));
  if(leader) drawHorse(leader,true);

  // Decay crowd excitement
  if(crowdExcite>0) crowdExcite=Math.max(0,crowdExcite-0.012);
}

/* ── HORSE DRAWING ─────────────────────────────────────────────── */
// Horse faces RIGHT in local space. Coat color = realistic.
// Silk shown as a small bullseye circle on the saddle area.

function drawHorse(h, isLeader){
  const pos=trackPos(h.progress, h.laneOffset);
  const angle=travelAngle(h.progress);
  const c=h.coat;   // coat colors
  const s=h.silk;   // silk colors
  const g=Math.sin(tick*0.28+h.phase)*5.2; // gallop

  ctx.save();
  ctx.translate(pos.x, pos.y);
  ctx.rotate(angle);
  // When traveling leftward (bottom half of oval) the y-axis inverts and
  // legs point upward. Flip y in the rotated frame to correct it.
  if (Math.cos(angle) < 0) ctx.scale(1, -1);

  // Leader / big-move glow
  if(isLeader){ ctx.shadowColor='#FFD700'; ctx.shadowBlur=12; }
  else if(h.bigMoveActive){ ctx.shadowColor='#FF6A00'; ctx.shadowBlur=16; }

  // TAIL
  ctx.save();
  ctx.strokeStyle=c.mane; ctx.lineWidth=2.8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-12,-1); ctx.bezierCurveTo(-17,-3,-22,-8+g*0.4,-20,-14); ctx.stroke();
  ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.moveTo(-20,-14); ctx.bezierCurveTo(-21,-17+g*0.3,-18,-20,-19,-23); ctx.stroke();
  ctx.restore();

  // BACK LEGS
  ctx.strokeStyle=c.leg; ctx.lineWidth=2.8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-5,4); ctx.lineTo(-6-g,15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-3,4); ctx.lineTo(-1+g,15); ctx.stroke();

  // BODY
  ctx.fillStyle=c.body; ctx.strokeStyle='rgba(0,0,0,0.22)'; ctx.lineWidth=0.9;
  ctx.beginPath();
  ctx.moveTo(-12,0);
  ctx.bezierCurveTo(-12,-9,-5,-11,0,-10);
  ctx.bezierCurveTo(7,-9,14,-6,13,1);
  ctx.bezierCurveTo(12,7,4,9,-5,8);
  ctx.bezierCurveTo(-10,7,-12,5,-12,0);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // Body highlight (subtle sheen)
  ctx.save();
  const shine=ctx.createLinearGradient(0,-10,0,8);
  shine.addColorStop(0,'rgba(255,255,255,0.12)');
  shine.addColorStop(0.5,'rgba(255,255,255,0.0)');
  ctx.fillStyle=shine;
  ctx.beginPath();
  ctx.moveTo(-12,0);
  ctx.bezierCurveTo(-12,-9,-5,-11,0,-10);
  ctx.bezierCurveTo(7,-9,14,-6,13,1);
  ctx.bezierCurveTo(12,7,4,9,-5,8);
  ctx.bezierCurveTo(-10,7,-12,5,-12,0);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // FRONT LEGS
  ctx.strokeStyle=c.leg; ctx.lineWidth=2.8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(6,5); ctx.lineTo(8+g,15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(9,5); ctx.lineTo(6-g,15); ctx.stroke();

  // NECK
  ctx.fillStyle=c.body; ctx.strokeStyle='rgba(0,0,0,0.18)'; ctx.lineWidth=0.8;
  ctx.beginPath();
  ctx.moveTo(8,-7); ctx.bezierCurveTo(10,-14,12,-17,14,-20);
  ctx.bezierCurveTo(11,-17,10,-11,9,-5); ctx.closePath(); ctx.fill(); ctx.stroke();

  // MANE (on neck)
  ctx.strokeStyle=c.mane; ctx.lineWidth=1.8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(10,-9); ctx.lineTo(9,-12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(11,-13); ctx.lineTo(10,-16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(13,-16); ctx.lineTo(12,-19); ctx.stroke();

  // HEAD
  ctx.fillStyle=c.body; ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=0.9;
  ctx.beginPath(); ctx.ellipse(17,-22,7.5,4.2,0.55,0,Math.PI*2); ctx.fill(); ctx.stroke();

  // Hank's blaze
  if(h.horse==='Hank'){
    ctx.fillStyle='rgba(255,255,255,0.62)';
    ctx.beginPath(); ctx.ellipse(19,-21,2.2,3.5,0.5,0,Math.PI*2); ctx.fill();
  }

  // Muzzle lighter
  ctx.fillStyle=c.nose;
  ctx.beginPath(); ctx.ellipse(21.5,-22.5,3,2.2,0.55,0,Math.PI*2); ctx.fill();

  // Nostril
  ctx.fillStyle='rgba(0,0,0,0.55)';
  ctx.beginPath(); ctx.arc(22.5,-23,1.1,0,Math.PI*2); ctx.fill();

  // Eye
  ctx.fillStyle='rgba(0,0,0,0.88)';
  ctx.beginPath(); ctx.arc(14,-25,1.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.4)'; // eye highlight
  ctx.beginPath(); ctx.arc(14.5,-25.4,0.4,0,Math.PI*2); ctx.fill();

  // Ear
  ctx.fillStyle=c.body; ctx.strokeStyle='rgba(0,0,0,0.22)'; ctx.lineWidth=0.7;
  ctx.beginPath(); ctx.moveTo(11,-26); ctx.lineTo(9,-30); ctx.lineTo(13,-28); ctx.closePath();
  ctx.fill(); ctx.stroke();

  // ── SILK BADGE (saddle area: circle on horse's back) ──
  ctx.shadowBlur=0;
  // Outer circle = primary silk
  ctx.fillStyle=s.primary; ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=0.8;
  ctx.beginPath(); ctx.arc(2,-10,5.8,0,Math.PI*2); ctx.fill(); ctx.stroke();
  // Inner circle = secondary silk
  ctx.fillStyle=s.secondary;
  ctx.beginPath(); ctx.arc(2,-10,2.6,0,Math.PI*2); ctx.fill();

  // PP number inside the badge
  ctx.fillStyle = (s.secondary==='#FFFFFF'||s.secondary==='#C0C0C0'||s.secondary==='#EAB308'||s.secondary==='#F97316') ? '#000' : '#fff';
  ctx.font='bold 5.5px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(h.pp, 2, -10);

  // JOCKEY BODY (secondary silk)
  ctx.fillStyle=s.secondary; ctx.strokeStyle='rgba(0,0,0,0.28)'; ctx.lineWidth=0.8;
  ctx.beginPath(); ctx.ellipse(2,-14,6.5,4.5,-0.3,0,Math.PI*2); ctx.fill(); ctx.stroke();

  // JOCKEY CAP (primary silk)
  ctx.fillStyle=s.primary;
  ctx.beginPath(); ctx.ellipse(0,-19,5.5,3,-0.2,0,Math.PI*2); ctx.fill(); ctx.stroke();
  // Cap brim
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(3,-20,6,1.5,-0.15,0,Math.PI*2); ctx.fill();

  ctx.restore();

  // ── ALWAYS-ON NAME LABEL ──────────────────────────────────────
  // Every horse gets a small name tag so viewers can follow them.
  // Leader gets gold + crown, big-mover gets orange, others get a
  // subtle white-on-dark tag that stays readable but doesn't clutter.
  {
    ctx.save();
    ctx.translate(pos.x, pos.y - 42);

    const label = h.horse;
    ctx.font = 'bold 8.5px "Barlow",sans-serif';
    const tw = ctx.measureText(label).width;

    if (isLeader) {
      // Gold pill for the leader
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.beginPath(); ctx.roundRect(-tw/2-5,-10,tw+10,14,3); ctx.fill();
      ctx.fillStyle = '#FFD700';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(label, 0, -3);
      // Crown above
      ctx.font = '11px sans-serif';
      ctx.fillText('👑', 0, -18);
    } else if (h.bigMoveActive) {
      // Orange pill for the charging horse
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.beginPath(); ctx.roundRect(-tw/2-5,-10,tw+10,14,3); ctx.fill();
      ctx.fillStyle = '#FF9900';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(label + ' 🔥', 0, -3);
    } else {
      // Subtle semi-transparent pill for all other horses
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.beginPath(); ctx.roundRect(-tw/2-4,-9,tw+8,13,3); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.88)';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(label, 0, -2);
    }

    ctx.restore();
  }
}

/* ── ODDS ──────────────────────────────────────────────────────── */
const ODD_POOL = ['2-1','5-2','3-1','7-2','4-1','9-2','5-1','6-1','8-1','10-1','12-1','15-1'];
let oddsData = [];
function makeOdds(entries){
  const pool = shuffle([...ODD_POOL]);
  return entries.map((e,i)=>({ ...e, silk:SILKS[e.horse], odds:pool[i%pool.length] }));
}

/* ── PRE-RACE PANEL: Post Positions & Odds ─────────────────────── */
function showPreRacePanel(){
  document.getElementById('panel-header').textContent='Post Positions & Odds';
  document.getElementById('leaderboard').innerHTML =
    // Column header row
    `<div class="lb-row pp-header">
      <span class="lb-place">PP</span>
      <span class="silk-swatch" style="visibility:hidden"></span>
      <span class="pp-col-horse">Horse</span>
      <span class="pp-col-jockey">Jockey</span>
      <span class="odds-val pp-col-odds">Odds</span>
    </div>` +
    oddsData.map(o=>`
    <div class="lb-row">
      <span class="lb-place">${o.pp}</span>
      <span class="silk-swatch" style="background:${o.silk.primary};border-color:${o.silk.secondary}"></span>
      <span class="pp-col-horse">${o.horse}</span>
      <span class="pp-col-jockey">${o.jockey}</span>
      <span class="odds-val pp-col-odds">${o.odds}</span>
    </div>`).join('');
  document.getElementById('reset-btn').classList.add('hidden');
}

/* ── RUNNING ORDER PANEL (during race) ─────────────────────────── */
function updateLeaderboard(){
  document.getElementById('panel-header').textContent='Post Position';
  document.getElementById('leaderboard').innerHTML=sorted().map((h,i)=>`
    <div class="lb-row${i===0?' first-place':''}">
      <span class="lb-place">${i+1}</span>
      <span class="silk-swatch" style="background:${h.silk.primary};border-color:${h.silk.secondary}"></span>
      <div class="lb-info">
        <span class="lb-horse">${h.horse}</span>
        <span class="lb-jockey">🏇 ${h.jockey}</span>
      </div>
      ${h.finished?'<span class="lb-fin">FIN</span>':''}
    </div>`).join('');
}

/* ── RESULTS PANEL ─────────────────────────────────────────────── */
const MEDALS=['🥇','🥈','🥉'];
function showResultsInSidebar(){
  document.getElementById('panel-header').textContent='Official Results';
  const sorted2=[...raceResults].sort((a,b)=>a.place-b.place);
  document.getElementById('leaderboard').innerHTML=sorted2.map((h,i)=>`
    <div class="lb-row result-row${i===0?' first-place':''}">
      <span class="lb-place">${MEDALS[h.place-1]||(h.place+'th')}</span>
      <span class="silk-swatch" style="background:${h.silk.primary};border-color:${h.silk.secondary}"></span>
      <div class="lb-info">
        <span class="lb-horse">${h.horse}</span>
        <span class="lb-jockey">🏇 ${h.jockey}</span>
      </div>
    </div>`).join('');
  const btn = document.getElementById('reset-btn');
  btn.textContent = '↺ Reset Race';
  btn.classList.remove('hidden');
  btn.onclick = () => setupRace();
  if(audioMode===1) speak(sorted2.slice(0,3).map((h,i)=>['Winner','Second','Third'][i]+': '+h.horse+' with jockey '+h.jockey).join('. ')+'.');
  if(audioMode>0) setTimeout(playFanfare,300);
}

/* ── FINISH COMMENTARY ─────────────────────────────────────────── */
const PLACE_NAMES = ['first','second','third','fourth','fifth','sixth','seventh','eighth'];

function finishCommentary(place, horse, jockey) {
  let text;
  switch(place) {
    case 1:
      text = `${horse} WINS!! ${jockey} brings ${horse} home — what a performance!`;
      break;
    case 2:
      text = `And ${horse} crosses second — ${jockey} gave it everything in the stretch!`;
      break;
    case 3:
      text = `${horse} in third, ${jockey} right behind — great run!`;
      break;
    default:
      text = `Now ${horse} coming through — ${jockey} finishing ${PLACE_NAMES[place-1]}!`;
  }
  triggerCommentary(text, place === 1 ? ()=>playCrowd(4.0, 0.35) : null);
}

/* ── MAIN LOOP ─────────────────────────────────────────────────── */
let lastFinishCount = 0;

function loop(){
  tick++;
  const fin=tickHorses();
  checkCommentary();
  drawScene();
  updateLeaderboard();

  // Fire commentary for each newly finished horse
  if (fin > lastFinishCount) {
    for (let p = lastFinishCount + 1; p <= fin; p++) {
      const h = raceResults.find(r => r.place === p);
      if (h) {
        const delay = (p - lastFinishCount - 1) * 1800; // stagger multi-finishes
        setTimeout(() => finishCommentary(p, h.horse, h.jockey), delay);
      }
    }
    lastFinishCount = fin;
  }

  if(fin===horses.length){
    racePhase='finished';
    cancelAnimationFrame(frameId);
    stopHoofbeats();
    // Final summary after all horses have been called — delayed so last finisher call clears first
    const lastDelay = (horses.length - 1) * 1800 + 2400;
    setTimeout(() => {
      const w = raceResults[0];
      setCommentaryText(`🏆 Official result: ${w.horse.toUpperCase()} wins the Positive Strides Stakes! Jockey ${w.jockey}!`);
      if (audioMode === 1) speak(`Official result: ${w.horse} wins the Positive Strides Stakes! Jockey ${w.jockey}!`);
    }, lastDelay);
    showResultsInSidebar();
    document.getElementById('action-btn').disabled=true;
    document.getElementById('action-btn').textContent='🏁 Race Complete';
    return;
  }
  frameId=requestAnimationFrame(loop);
}

/* ── COUNTDOWN ─────────────────────────────────────────────────── */
function startCountdown(cb){
  const ov=document.getElementById('countdown-overlay');
  const ne=document.getElementById('countdown-num');
  ov.classList.remove('hidden');
  let n=3;
  function step(){
    if(n>0){
      ne.textContent=n; ne.style.animation='none'; void ne.offsetWidth; ne.style.animation='';
      if(audioMode>0) playBell();
      n--; setTimeout(step,900);
    } else {
      ne.textContent='GO!'; ne.style.animation='none'; void ne.offsetWidth; ne.style.animation='';
      setTimeout(()=>{ ov.classList.add('hidden'); cb(); },700);
    }
  }
  step();
}

/* ── SETUP ─────────────────────────────────────────────────────── */
function setupRace(){
  racePhase='pre'; tick=0; raceResults=[]; cfired.clear(); crowdExcite=0; lastFinishCount=0;
  stopHoofbeats();
  if(frameId) cancelAnimationFrame(frameId);

  const entries = buildEntries();  // fresh random PP order + jockey set every time
  document.getElementById('race-num').textContent='Positive Strides Stakes 2026 · Timber Grove Farm';
  document.getElementById('race-name').textContent='Positive Strides Stakes';
  document.getElementById('race-meta').textContent='Presented by Positive Strides Center';

  oddsData = makeOdds(entries);
  horses   = initHorses(entries);
  drawScene();
  showPreRacePanel();

  const btn = document.getElementById('action-btn');
  btn.disabled = false;
  btn.textContent = '🏁 Post Time — Start Race';
  btn.onclick = handleStart;
  document.getElementById('reset-btn').classList.add('hidden');
  setCommentaryText('Welcome to the Positive Strides Stakes! Check your programs — the horses are heading to the post!');
}

function handleStart(){
  if(racePhase!=='pre')return;
  racePhase='countdown';
  if (audioMode > 0) {
    ensureAudio().then(() => {
      if (audioMode === 1 && !speechUnlocked) unlockSpeech();
    });
  }
  document.getElementById('action-btn').disabled=true;
  document.getElementById('action-btn').textContent='🏇 Racing...';
  updateLeaderboard(); // switch sidebar to running order
  speak('And they approach the starting gate...');
  startCountdown(()=>{
    racePhase='racing';
    if(audioMode>0) startHoofbeats();
    frameId=requestAnimationFrame(loop);
  });
}

// ── FULLSCREEN WITH CONTENT SCALING ───────────────────────────
const fsBtn = document.getElementById('fullscreen-btn');

function applyFullscreenScale() {
  const wrapper = document.getElementById('wrapper');
  const ww = window.innerWidth;
  const wh = window.innerHeight;
  const naturalW = wrapper.scrollWidth;
  const naturalH = wrapper.scrollHeight;
  const scale = Math.min(ww / naturalW, wh / naturalH, 3.0); // cap at 3×
  wrapper.style.transform = `scale(${scale})`;
  wrapper.style.transformOrigin = 'top center';
  wrapper.style.marginTop = '0';
  // Centre vertically if there's leftover height
  const scaledH = naturalH * scale;
  const topPad = Math.max(0, (wh - scaledH) / 2);
  wrapper.style.marginTop = topPad + 'px';
}

function clearFullscreenScale() {
  const wrapper = document.getElementById('wrapper');
  wrapper.style.transform = '';
  wrapper.style.transformOrigin = '';
  wrapper.style.marginTop = '';
}

fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen().catch(()=>{});
  }
});

document.addEventListener('fullscreenchange', () => {
  if (document.fullscreenElement) {
    document.body.classList.add('is-fullscreen');
    fsBtn.textContent = '✕ Exit Full Screen';
    // Wait one frame for layout to settle then scale
    requestAnimationFrame(() => { requestAnimationFrame(applyFullscreenScale); });
  } else {
    document.body.classList.remove('is-fullscreen');
    fsBtn.textContent = '⛶ Full Screen';
    clearFullscreenScale();
  }
});

window.addEventListener('resize', () => {
  if (document.fullscreenElement) applyFullscreenScale();
});

// Pre-load voices so they're ready when first speak() fires
if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.addEventListener('voiceschanged', () => {
    cachedVoice = null; // clear cache so loadVoice() re-picks with full list
    loadVoice();
  });
}

setupRace();
</script>
